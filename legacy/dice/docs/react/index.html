<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Дуэль на кубиках — React</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f0ea}*{box-sizing:border-box}body{margin:0;min-width:320px}button{font:inherit;cursor:pointer}.page{min-height:100vh;display:grid;place-items:center;padding:32px 16px}.game{width:min(780px,100%);background:#fff;border:1px solid #ddd5ca;border-radius:28px;padding:42px;box-shadow:0 18px 55px rgba(36,30,22,.1);text-align:center}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700;opacity:.55}h1{margin:10px 0 8px;font-size:clamp(34px,7vw,58px);line-height:1}.subtitle{margin:0 0 30px;color:#6e675f}.players{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}.player-card{padding:22px;border:1px solid #e4ded6;border-radius:20px;background:#faf8f5}.player-card h2{margin:0 0 18px;font-size:18px}.player-card strong{display:block;margin-top:14px;font-size:30px}.dice{display:flex;justify-content:center;gap:10px}.die{width:70px;height:70px;display:grid;place-items:center;border-radius:15px;background:#171717;color:#fff;font-size:30px;font-weight:800;box-shadow:0 8px 16px rgba(0,0,0,.15)}.vs{font-weight:900;font-size:14px;opacity:.4}.message{min-height:28px;margin:28px 0 18px;font-size:20px;font-weight:700}.primary,.secondary{border:0;border-radius:12px;padding:13px 20px;margin:0 4px}.primary{background:#171717;color:#fff}.secondary{background:#eee9e2;color:#171717}.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:28px;color:#756e65;font-size:13px}.stats b{color:#171717}@media(max-width:620px){.game{padding:28px 18px}.players{grid-template-columns:1fr}.vs{margin:-6px 0}.player-card{padding:18px}}
</style>
</head><body><div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState}=React; const roll=()=>Math.floor(Math.random()*6)+1;
function Die({value}){return <div className="die">{value}</div>}
function App(){const[player,setPlayer]=useState([1,1]);const[computer,setComputer]=useState([1,1]);const[message,setMessage]=useState('Нажми «Бросить кубики», чтобы начать!');const[rounds,setRounds]=useState(0);const[wins,setWins]=useState({player:0,computer:0,draw:0});
const play=()=>{const p=[roll(),roll()],c=[roll(),roll()],ps=p[0]+p[1],cs=c[0]+c[1];setPlayer(p);setComputer(c);setRounds(r=>r+1);if(ps>cs){setMessage('Ты победила! 🎉');setWins(w=>({...w,player:w.player+1}))}else if(ps<cs){setMessage('Компьютер победил! 🤖');setWins(w=>({...w,computer:w.computer+1}))}else{setMessage('Ничья! 🤝');setWins(w=>({...w,draw:w.draw+1}))}};
const reset=()=>{setPlayer([1,1]);setComputer([1,1]);setMessage('Нажми «Бросить кубики», чтобы начать!');setRounds(0);setWins({player:0,computer:0,draw:0})};
return <main className="page"><section className="game"><div className="eyebrow">REACT • GAME</div><h1>Дуэль на кубиках</h1><p className="subtitle">Два кубика решают, кто сегодня сильнее.</p><div className="players"><div className="player-card"><h2>Ты</h2><div className="dice"><Die value={player[0]}/><Die value={player[1]}/></div><strong>{player[0]+player[1]}</strong></div><div className="vs">VS</div><div className="player-card"><h2>Компьютер</h2><div className="dice"><Die value={computer[0]}/><Die value={computer[1]}/></div><strong>{computer[0]+computer[1]}</strong></div></div><div className="message">{message}</div><button className="primary" onClick={play}>Бросить кубики</button><button className="secondary" onClick={reset}>Сбросить</button><div className="stats"><span>Раундов: <b>{rounds}</b></span><span>Побед: <b>{wins.player}</b></span><span>Компьютер: <b>{wins.computer}</b></span><span>Ничьих: <b>{wins.draw}</b></span></div></section></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
